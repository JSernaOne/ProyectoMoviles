<html>
  <head>
    <meta charset="utf-8" />
    <!--
    Customize this policy to fit your own app's needs. For more guidance, please refer to the docs:
        https://cordova.apache.org/docs/en/latest/
    Some notes:
        * https://ssl.gstatic.com is required only on Android and is needed for TalkBack to function properly
        * Disables use of inline scripts in order to mitigate risk of XSS vulnerabilities. To change this:
            * Enable inline JS: add 'unsafe-inline' to default-src
    -->
    <!-- <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content:;"
    />-->
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="initial-scale=1, width=device-width, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />

    <title>MovileProject</title>

    <link rel="stylesheet" href="lib/onsenui/css/onsenui-core.min.css" />
    <link
      rel="stylesheet"
      href="lib/onsenui/css/onsen-css-components.min.css"
    />

    <script src="lib/js-sha256/build/sha256.min.js"></script>
    <script src="js/config/myBD.js"></script>
    <script src="js/config/sync.config.js"></script>
    
  </head>
  <body>
    <ons-navigator
      swipeable
      id="myNavigator"
      page="inicio.html"
    ></ons-navigator>

    <template id="inicio.html">
      <ons-page id="inicio">
        <ons-toolbar>
          <div class="center">Ingreso</div>
        </ons-toolbar>
        <div style="text-align: center; margin-top: 30px">
          <p>
            <ons-input
              id="email"
              modifier="underbar"
              placeholder="Email"
              data-type="email"
              float
            ></ons-input>
          </p>
          <p>
            <ons-input
              id="password"
              modifier="underbar"
              type="password"
              placeholder="Password"
              float
            ></ons-input>
          </p>
          <p style="margin-top: 30px">
            <ons-button id="login-button">Ingresar</ons-button>
          </p>
          <p style="margin-top: 20px">
            <ons-button id="push-registro">Registrarse</ons-button>
          </p>
        </div>
        <p style="margin-top: 20px; margin-left: 10px">
          <ons-button id="show-users">Mostrar Usuarios</ons-button>
        </p>
        <ons-list
          id="users-list"
          style="margin-left: 10px; margin-top: 20px; margin-right: 10px"
        >
          <ons-list-header>Usuarios</ons-list-header>
        </ons-list>
      </ons-page>
    </template>

    <template id="registro.html">
      <ons-page id="registro">
        <ons-toolbar>
          <div class="left">
            <ons-back-button>Inicio</ons-back-button>
          </div>
          <div class="center"></div>
        </ons-toolbar>
        <div style="text-align: center; margin-top: 30px">
          <p>
            <ons-input
              id="nombre"
              modifier="underbar"
              placeholder="Nombre"
              float
              data-type="text"
              minlength="3"
              maxlength="50"
            ></ons-input>
          </p>

          <p>
            <ons-input
              id="username_register"
              modifier="underbar"
              placeholder="Username"
              float
              data-type="text"
              minlength="3"
              maxlength="32"
            ></ons-input>
          </p>
          <p>
            <ons-input
              id="correo"
              modifier="underbar"
              placeholder="Correo"
              float
              data-type="email"
              minlength="3"
              maxlength="70"
            ></ons-input>
          </p>
          <p>
            <ons-input
              id="contrasena"
              modifier="underbar"
              type="password"
              placeholder="Contrasena"
              float
            ></ons-input>
          </p>
          <p>
            <ons-input
              id="telefono"
              modifier="underbar"
              placeholder="Telefono"
              float
              data-type="tel"
              minlength="10"
              maxlength="10"
            ></ons-input>
          </p>
          <p>
            <ons-button id="registro-button">Registrarse</ons-button>
          </p>
        </div>
      </ons-page>
    </template>

    <script src="cordova.js"></script>
    <script src="js/index.js"></script>
    <script src="lib/onsenui/js/onsenui.min.js"></script>

    <script src="js//user/services/login.service.js"></script>
    <script src="js//user/models/user.model.js"></script>

  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta
            name="viewport"
            content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
    <meta name="color-scheme" content="light dark"/>

    <title>Login</title>

    <link rel="stylesheet" href="lib/onsenui/css/onsenui-core.min.css"/>
    <link rel="stylesheet" href="lib/onsenui/css/onsen-css-components.min.css"/>
    <link rel="stylesheet" href="css/assetsFile/tabla.css"/>

</head>
<body>
<ons-navigator
        swipeable
        id="myNavigator"
        page="inicio.html"
></ons-navigator>

<template id="inicio.html">
    <ons-page id="inicio">
        <ons-toolbar>
            <div class="center">Home</div>
        </ons-toolbar>
        <p style="margin-left: 10px;">Métodos</p>
        <ons-button id="push-button" style="margin-left: 10px;">Localización</ons-button>
        <ons-button id="connect" style="margin-left: 10px;">Test</ons-button>
    </ons-page>
</template>

<template id="mapa.html">
    <ons-page id="mapa">
        <ons-toolbar>
            <div class="left">
                <ons-back-button>Home</ons-back-button>
            </div>
            <div class="center"></div>
        </ons-toolbar>
        <ons-button id="push-tabla" style="margin-left: 10px; margin:10px" onclick="todos()">Obtener
            Localización
        </ons-button>
        <table class="table table-hover" style="margin-left: 10px; margin:10px">
            <caption style="margin:10px">Tabla de Geolocalización</caption>
            <thead>
            <tr>
                <th>Latitud</th>
                <th>Longitud</th>
                <th>Altitud</th>
                <th>Exactitud</th>
                <th>Altitud Exacta</th>
                <th>Velocidad</th>
                <th>Rumbo</th>
                <th>Marca de Tiempo</th>
            </tr>
            </thead>
            <tbody id="tabla">
            </tbody>
        </table>
    </ons-page>
</template>

<script src="cordova.js"></script>
<script src="js/index.js"></script>
<script src="lib/onsenui/js/onsenui.min.js"></script>

<!--personalizados-->

<script src="js/geolocalizacion.js"></script>
<script src="js/vibracion.js"></script>

<script>
    function todos(){
        obtenerGeolocalizacion();
        vibrar();
    }
</script>
</body>
</html>

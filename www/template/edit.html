<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil</title>

    <link rel="stylesheet" href="../lib/onsenui/css/onsenui-core.min.css">
    <link rel="stylesheet" href="../lib/onsenui/css/onsen-css-components.min.css">
    <link rel="stylesheet" href="../css/Style/perfil-style.css">

</head>
<body>
    <div class="container">
        <div class="photo">
            <img src="foto-placeholder.png" alt="Foto de perfil">
        </div>
        <form>
            <div class="form-group">
                <label for="usuario">USUARIO</label>
                <input type="text" id="usuario" name="usuario">
            </div>
            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena">
            </div>
            <div class="form-group">
                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo">
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono">
            </div>
            <div class="save-button">
                <button type="submit">Guardar</button>
            </div>
        </form>
    </div>
</body>

<script src="../cordova.js"></script>
<script src="../lib/onsenui/js/onsenui.min.js"></script>

</html>

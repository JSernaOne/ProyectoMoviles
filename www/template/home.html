<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="color-scheme" content="light dark" />

    <title>Home</title>

    <link rel="stylesheet" href="../lib/onsenui/css/onsenui-core.min.css" />
    <link
      rel="stylesheet"
      href="../lib/onsenui/css/onsen-css-components.min.css"
    />
    <link rel="stylesheet" href="../css/Style/fade-out.css" />
    <link rel="stylesheet" href="../css/Style/loading-spinner.css" />
    <link rel="stylesheet" href="../css/Style/home-style.css" />
    <link rel="stylesheet" href="../css/assetsFile\bottons.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

    <script src="../js/config/myBD.js"></script>
    <script src="../js/config/sync.config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
  </head>
  <body>
    <ons-navigator
      swipeable
      id="myNavigator"
      page="inicio.html"
    ></ons-navigator>

    <template id="inicio.html">
      <ons-page id="inicio">
        <ons-toolbar>
          <div class="center">Home</div>
        </ons-toolbar>

        <div style="text-align: center; margin-top: 50px">
          <h3 id="welcome-message">Bienvenido</h3>
          <p id="motivational-quote"></p>
          <p id="autor-quote"></p>
          <p id="current-date">Fecha Actual</p>
          <ons-button id="add-task-button" class="task-list"
            >Agregar tarea</ons-button
          >
        </div>

        <p style="margin-top: 20px; margin-left: 10px">
          <ons-button id="show-tasks-button">Mostrar tareas</ons-button>
        </p>
        <ons-list
          id="tasks-list"
          style="margin-left: 10px; margin-top: 20px; margin-right: 10px"
        >
          <ons-list-header>Tareas</ons-list-header>
        </ons-list>

        <div class="bottom-toolbar-container">
          <ons-button id="map" class="bottom-toolbar-button">
            <i class="fas fa-location-dot"></i>
          </ons-button>
          <ons-button id="config" class="bottom-toolbar-button">
            <i class="fas fa-gear"></i>
          </ons-button>
          <ons-button id="volver" class="bottom-toolbar-button">
            <i class="fas fa-arrow-left"></i>
          </ons-button>
        </div>
      </ons-page>
    </template>

    <ons-progress-circular
      id="loading-spinner"
      indeterminate
    ></ons-progress-circular>

    <script src="../cordova.js"></script>
    <script src="../lib/onsenui/js/onsenui.min.js"></script>

    <script src="../js/index.js"></script>
    <script src="../js/home.js"></script>
    <script src="../js/tasks/models/task.model.js"></script>
    <script src="../js/tasks/services/task.service.js"></script>
    <script src="../js/geolocalizacion/models/geolo.model.js"></script>
    <script src="../js/geolocalizacion/services/geolo.service.js"></script>
    <script src="../js/user/models/login.model.js"></script>
    <script src="../js/user/models/user.model.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Tarea</title>

    <link rel="stylesheet" href="../lib/onsenui/css/onsenui-core.min.css">
    <link rel="stylesheet" href="../lib/onsenui/css/onsen-css-components.min.css">
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCOr4tiznICsTgUolq99SYbtazjd0aFbAE&callback=initMap"></script>
</head>
<body>
<ons-page id="add-task-page">
    <ons-toolbar>
        <div class="center">Agregar Tarea</div>
        <div class="right">
            <ons-toolbar-button onclick="closeAddTaskPage()">Cerrar</ons-toolbar-button>
        </div>
    </ons-toolbar>

    <div style="padding: 20px;">
        <ons-input id="task-name" placeholder="Tarea" float></ons-input>
        <p></p>
        <ons-list>
            <ons-list-item>
                <div class="center">
                    <ons-input type="date" id="task-date"></ons-input>
                </div>
            </ons-list-item>
            <ons-list-item>
                <div class="center">
                    <ons-input type="time" id="task-time"></ons-input>
                </div>
            </ons-list-item>
        </ons-list>
        <p></p>
        <ons-list>
            <ons-list-header>Importancia</ons-list-header>
            <ons-list-item tappable>
                <label class="left">
                    <ons-radio name="importance" input-id="importance-1" value="1"></ons-radio>
                    <span style="color: green;">Baja</span>
                </label>
            </ons-list-item>
            <ons-list-item tappable>
                <label class="left">
                    <ons-radio name="importance" input-id="importance-2" value="2"></ons-radio>
                    <span style="color: blue;">Media</span>
                </label>
            </ons-list-item>
            <ons-list-item tappable>
                <label class="left">
                    <ons-radio name="importance" input-id="importance-3" value="3"></ons-radio>
                    <span style="color: yellow;">Alta</span>
                </label>
            </ons-list-item>
            <ons-list-item tappable>
                <label class="left">
                    <ons-radio name="importance" input-id="importance-4" value="4"></ons-radio>
                    <span style="color: red;">Muy Alta</span>
                </label>
            </ons-list-item>
        </ons-list>
        <p></p>
        <div id="map" style="height: 300px; width: 100%;"></div>
        <ons-input type="hidden" id="task-latitude"></ons-input>
        <ons-input type="hidden" id="task-longitude"></ons-input>
        <ons-button onclick="saveTask()">Guardar Tarea</ons-button>
    </div>
</ons-page>

<script src="../js/add-task.js"></script>
<script src="../cordova.js"></script>
<script src="../lib/onsenui/js/onsenui.min.js"></script>

</body>
</html>
